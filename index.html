<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Photo Effect</title>

<style>

/* =========================
   전체
========================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
}

body {
    display: block;
}


/* =========================
   사진 카드
========================= */

.card {
    position: relative;

    width: 100%;
    height: 100%;

    overflow: hidden;

    border-radius: 20px;

    cursor: pointer;

    background: transparent;

    /* 보잉 효과 때문에 기준점 설정 */
    transform-origin: center center;
}


/* =========================
   사진
========================= */

.card img {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    opacity: 0;

    display: block;

    pointer-events: none;
    user-select: none;

    transition: opacity 0.42s ease;
}


/* ① 기본 */

.card .photo1 {
    opacity: 1;
}


/* =========================
   마우스 올림
   ① → ②
========================= */

.card:hover .photo1 {
    opacity: 0;
}

.card:hover .photo2 {
    opacity: 1;
}


/* =========================
   클릭
   → ③
========================= */

.card.clicked .photo1,
.card.clicked .photo2 {
    opacity: 0;
}

.card.clicked .photo3 {
    opacity: 1;
}


/* =========================
   광택
========================= */

.shine {
    position: absolute;

    z-index: 30;

    top: -70%;
    left: -80%;

    width: 30%;
    height: 240%;

    opacity: 0;

    pointer-events: none;

    transform: rotate(20deg);

    filter: blur(6px);

    background: linear-gradient(
        90deg,

        transparent 0%,

        rgba(255,255,255,0.03) 15%,

        rgba(255,255,255,0.20) 30%,

        rgba(255,255,255,0.60) 43%,

        rgba(255,255,255,0.95) 50%,

        rgba(225,190,255,0.60) 57%,

        rgba(255,255,255,0.15) 70%,

        transparent 100%
    );
}


@keyframes shineMove {

    0% {
        left: -80%;
        opacity: 0;
    }

    10% {
        opacity: 1;
    }

    75% {
        opacity: 0.9;
    }

    100% {
        left: 140%;
        opacity: 0;
    }
}


/* =========================
   보라색 은은한 광원
========================= */

.glow {
    position: absolute;

    z-index: 20;

    inset: 0;

    opacity: 0;

    pointer-events: none;

    background: radial-gradient(
        circle at 50% 40%,
        rgba(230,195,255,0.16),
        rgba(145,80,255,0) 65%
    );

    transition: opacity 0.45s ease;
}


.card:hover:not(.clicked) .glow {
    opacity: 1;
}


/* =========================
   보잉 효과
========================= */

.card.boing {
    animation: boing 0.55s
        cubic-bezier(.22, 1.4, .36, 1);
}


@keyframes boing {

    0% {
        transform: scale(1);
    }

    /* 순간적으로 눌림 */
    18% {
        transform:
            scaleX(0.96)
            scaleY(0.91);
    }

    /* 통! 하고 커짐 */
    40% {
        transform:
            scaleX(1.035)
            scaleY(1.07);
    }

    /* 반동 */
    60% {
        transform:
            scaleX(0.985)
            scaleY(0.97);
    }

    /* 한 번 더 살짝 */
    78% {
        transform:
            scaleX(1.01)
            scaleY(1.025);
    }

    100% {
        transform: scale(1);
    }
}


/* =========================
   하트가 나오는 영역
========================= */

.hearts {
    position: absolute;

    z-index: 100;

    inset: 0;

    overflow: hidden;

    pointer-events: none;
}


/* 각각의 하트 */

.heart {
    position: absolute;

    left: 50%;
    top: 50%;

    font-family:
        Arial,
        "Apple Color Emoji",
        "Segoe UI Emoji",
        sans-serif;

    font-weight: bold;

    line-height: 1;

    pointer-events: none;

    user-select: none;

    will-change:
        transform,
        opacity;

    animation:
        heartPop 1.15s
        cubic-bezier(.17,.67,.28,1)
        forwards;
}


/* =========================
   하트 움직임
========================= */

@keyframes heartPop {

    0% {
        opacity: 0;

        transform:
            translate(-50%, -50%)
            translate(0px, 0px)
            scale(0.25)
            rotate(0deg);
    }

    12% {
        opacity: 1;
    }

    30% {
        transform:
            translate(-50%, -50%)
            translate(
                calc(var(--x) * 0.45),
                calc(var(--y) * 0.35)
            )
            scale(1.25)
            rotate(
                calc(var(--r) * 0.4)
            );
    }

    70% {
        opacity: 0.9;
    }

    100% {
        opacity: 0;

        transform:
            translate(-50%, -50%)
            translate(
                var(--x),
                var(--y)
            )
            scale(0.75)
            rotate(var(--r));
    }
}


/* =========================
   클릭 순간 반짝임
========================= */

.flash {
    position: absolute;

    z-index: 50;

    inset: 0;

    opacity: 0;

    pointer-events: none;

    background:
        radial-gradient(
            circle at var(--flash-x, 50%)
                      var(--flash-y, 50%),

            rgba(255,255,255,0.55),

            rgba(255,190,230,0.20) 20%,

            transparent 55%
        );
}


.flash.active {
    animation: flashEffect 0.45s ease-out;
}


@keyframes flashEffect {

    0% {
        opacity: 0;
    }

    20% {
        opacity: 1;
    }

    100% {
        opacity: 0;
    }
}

</style>
</head>


<body>


<div class="card" id="card">


    <!-- ① 기본 사진 -->

    <img
        src="photo1.png"
        class="photo1"
        alt=""
    >


    <!-- ② 마우스 오버 -->

    <img
        src="photo2.png"
        class="photo2"
        alt=""
    >


    <!-- ③ 클릭 -->

    <img
        src="photo3.png"
        class="photo3"
        alt=""
    >


    <!-- 은은한 광원 -->

    <div class="glow"></div>


    <!-- 광택 -->

    <div class="shine"></div>


    <!-- 클릭 반짝임 -->

    <div
        class="flash"
        id="flash"
    ></div>


    <!-- 하트 -->

    <div
        class="hearts"
        id="hearts"
    ></div>


</div>



<script>

/* =========================
   요소
========================= */

const card =
    document.getElementById("card");

const shine =
    card.querySelector(".shine");

const hearts =
    document.getElementById("hearts");

const flash =
    document.getElementById("flash");


/* =========================
   광택 실행
========================= */

function playShine() {

    shine.style.animation = "none";

    void shine.offsetWidth;

    shine.style.animation =
        "shineMove 0.9s ease-out";
}


/* =========================
   보잉 실행
========================= */

function playBoing() {

    card.classList.remove("boing");

    void card.offsetWidth;

    card.classList.add("boing");


    setTimeout(function () {

        card.classList.remove("boing");

    }, 600);
}


/* =========================
   클릭 반짝임
========================= */

function playFlash(x, y) {

    const rect =
        card.getBoundingClientRect();


    const percentX =
        ((x - rect.left) / rect.width) * 100;

    const percentY =
        ((y - rect.top) / rect.height) * 100;


    flash.style.setProperty(
        "--flash-x",
        percentX + "%"
    );

    flash.style.setProperty(
        "--flash-y",
        percentY + "%"
    );


    flash.classList.remove("active");

    void flash.offsetWidth;

    flash.classList.add("active");
}


/* =========================
   하트 생성
========================= */

function createHearts(x, y) {

    const rect =
        card.getBoundingClientRect();


    const startX =
        x - rect.left;

    const startY =
        y - rect.top;


    /* 하트 개수 */

    const heartCount = 16;


    const heartCharacters = [
        "♥",
        "♡",
        "♥",
        "♡"
    ];


    for (
        let i = 0;
        i < heartCount;
        i++
    ) {

        const heart =
            document.createElement("span");


        heart.className = "heart";


        /* ♥ 또는 ♡ */

        heart.textContent =
            heartCharacters[
                Math.floor(
                    Math.random() *
                    heartCharacters.length
                )
            ];


        /* 클릭한 위치에서 시작 */

        heart.style.left =
            startX + "px";

        heart.style.top =
            startY + "px";


        /* 랜덤 방향 */

        const angle =
            Math.random() *
            Math.PI * 2;


        const distance =
            80 +
            Math.random() * 170;


        const moveX =
            Math.cos(angle) *
            distance;


        /*
           위쪽으로 조금 더 많이
           날아가도록 조정
        */

        const moveY =
            Math.sin(angle) *
            distance
            - 70;


        const rotation =
            -90 +
            Math.random() * 180;


        heart.style.setProperty(
            "--x",
            moveX + "px"
        );

        heart.style.setProperty(
            "--y",
            moveY + "px"
        );

        heart.style.setProperty(
            "--r",
            rotation + "deg"
        );


        /* 하트 크기 */

        const size =
            20 +
            Math.random() * 28;

        heart.style.fontSize =
            size + "px";


        /* 핑크 계열 */

        const colors = [
            "#ff4f87",
            "#ff72a1",
            "#ff9fbd",
            "#ffffff",
            "#ffd1df"
        ];

        heart.style.color =
            colors[
                Math.floor(
                    Math.random() *
                    colors.length
                )
            ];


        /* 약간씩 다른 속도 */

        const duration =
            0.85 +
            Math.random() * 0.5;

        heart.style.animationDuration =
            duration + "s";


        hearts.appendChild(heart);


        /* 끝난 하트 제거 */

        setTimeout(
            function () {

                heart.remove();

            },

            duration * 1000 + 100
        );
    }
}


/* =========================
   ① → ✨②

   마우스 올림
========================= */

card.addEventListener(
    "mouseenter",
    function () {

        playShine();

    }
);


/* =========================
   클릭

   ② → 💗③

   다시 클릭

   ③ → 💗②
========================= */

card.addEventListener(
    "click",
    function (event) {


        /*
           사진 변경
        */

        card.classList.toggle(
            "clicked"
        );


        /*
           보잉
        */

        playBoing();


        /*
           하트
        */

        createHearts(
            event.clientX,
            event.clientY
        );


        /*
           클릭 위치 반짝임
        */

        playFlash(
            event.clientX,
            event.clientY
        );

    }
);


/* =========================
   마우스 밖

   → ✨①
========================= */

card.addEventListener(
    "mouseleave",
    function () {


        /*
           ③ 상태 해제
        */

        card.classList.remove(
            "clicked"
        );


        /*
           광택
        */

        playShine();

    }
);


</script>

</body>
</html>
