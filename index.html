<!DOCTYPE html>
<html lang="ko">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>사진 효과</title>

<style>

/* =========================
   전체 기본 설정
========================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: transparent;
}


/* =========================
   BODY
========================= */

body {
    margin: 0;
    padding: 0;

    display: block;

    background: transparent;
}


/* =========================
   사진 카드
========================= */

.card {
    position: relative;

    width: 100%;
    height: 100%;

    overflow: hidden;

    /* 모서리 둥글게 */
    border-radius: 20px;

    cursor: pointer;

    /* 검은 배경 제거 */
    background: transparent;

    /* 그림자 제거 */
    box-shadow: none;
}


/* =========================
   사진 3장 공통
========================= */

.card img {
    position: absolute;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    opacity: 0;

    pointer-events: none;
    user-select: none;

    display: block;

    transition:
        opacity 0.5s ease;
}


/* =========================
   ① 처음 보이는 사진
========================= */

.card .photo1 {
    opacity: 1;
}


/* =========================
   마우스를 올림

   ① → ②
========================= */

.card:hover .photo1 {
    opacity: 0;
}

.card:hover .photo2 {
    opacity: 1;
}


/* =========================
   클릭

   ② → ③
========================= */

.card.clicked .photo1 {
    opacity: 0;
}

.card.clicked .photo2 {
    opacity: 0;
}

.card.clicked .photo3 {
    opacity: 1;
}


/* =========================
   광택
========================= */

.shine {
    position: absolute;

    z-index: 30;

    top: -70%;
    left: -80%;

    width: 30%;
    height: 240%;

    opacity: 0;

    pointer-events: none;

    transform: rotate(20deg);

    filter: blur(6px);

    background: linear-gradient(
        90deg,

        transparent 0%,

        rgba(255,255,255,0.03) 15%,

        rgba(255,255,255,0.20) 30%,

        rgba(255,255,255,0.60) 43%,

        rgba(255,255,255,0.95) 50%,

        rgba(225,190,255,0.60) 57%,

        rgba(255,255,255,0.15) 70%,

        transparent 100%
    );
}


/* =========================
   광택 이동
========================= */

@keyframes shineMove {

    0% {
        left: -80%;
        opacity: 0;
    }

    10% {
        opacity: 1;
    }

    75% {
        opacity: 0.9;
    }

    100% {
        left: 140%;
        opacity: 0;
    }
}


/* =========================
   은은한 보라색 빛
========================= */

.glow {
    position: absolute;

    z-index: 20;

    inset: 0;

    opacity: 0;

    pointer-events: none;

    background: radial-gradient(
        circle at 50% 40%,

        rgba(230,195,255,0.16),

        rgba(145,80,255,0) 65%
    );

    transition:
        opacity 0.45s ease;
}


/* ② 사진 상태에서 빛 */

.card:hover:not(.clicked) .glow {
    opacity: 1;
}


</style>

</head>


<body>


<div class="card" id="card">


    <!-- ① 기본 사진 -->

    <img
        src="photo1.png"
        class="photo1"
        alt="1번 사진"
    >


    <!-- ② 마우스를 올렸을 때 -->

    <img
        src="photo2.png"
        class="photo2"
        alt="2번 사진"
    >


    <!-- ③ 클릭했을 때 -->

    <img
        src="photo3.png"
        class="photo3"
        alt="3번 사진"
    >


    <!-- 은은한 빛 -->

    <div class="glow"></div>


    <!-- 지나가는 광택 -->

    <div class="shine"></div>


</div>



<script>


/* =========================
   카드 찾기
========================= */

const card =
    document.getElementById("card");


/* =========================
   광택 찾기
========================= */

const shine =
    card.querySelector(".shine");


/* =========================
   광택 실행
========================= */

function playShine() {

    shine.style.animation = "none";

    void shine.offsetWidth;

    shine.style.animation =
        "shineMove 0.9s ease-out";
}


/* =========================
   마우스 올림

   ① → ✨②
========================= */

card.addEventListener(
    "mouseenter",
    function () {

        playShine();

    }
);


/* =========================
   클릭

   ② → ③
   ③ → ②
========================= */

card.addEventListener(
    "click",
    function () {

        card.classList.toggle("clicked");

    }
);


/* =========================
   마우스 밖으로

   → ✨①
========================= */

card.addEventListener(
    "mouseleave",
    function () {

        card.classList.remove("clicked");

        playShine();

    }
);


</script>


</body>

</html>
